name: Build Cross-Platform Executables

on:
  push:
    tags:
      - 'v*'
  # Build and smoke-test the binaries (without releasing) when a PR changes
  # how they are built, or on demand.
  pull_request:
    paths:
      - '.github/workflows/build-executables.yml'
      - 'scripts/smoke_test.py'
      - 'src/dataforge/main.py'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # On a release tag, the full CI suite must pass before the release is made.
  tests:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/test.yml

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: dataforge
            asset_name: dataforge-linux-x64
          - os: windows-latest
            artifact_name: dataforge.exe
            asset_name: dataforge-windows-x64.exe
          # macos-latest runners are Apple Silicon, so this build is arm64.
          - os: macos-latest
            artifact_name: dataforge
            asset_name: dataforge-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      # PyInstaller only follows imports, so data files and plugins must be
      # named. Without them the binaries crashed on `agent-guide` (the guide
      # file), on any run (litellm's model price table) and on chunking
      # (tiktoken's encoding plugin); main.py then hid the crash.
      - name: Build executable
        run: >-
          uv run pyinstaller --onefile --name dataforge --exclude-module kaggle
          --collect-data dataforge
          --collect-data litellm
          --hidden-import tiktoken_ext
          --hidden-import tiktoken_ext.openai_public
          src/dataforge/main.py
        env:
          PYTHONPATH: src

      # The release uploads files by their own name, not the artifact's, and
      # the Linux and macOS builds are both `dataforge`: without this copy one
      # overwrote the other and the release had no macOS binary (#51).
      - name: Name the binary for its platform
        shell: bash
        run: cp "dist/${{ matrix.artifact_name }}" "dist/${{ matrix.asset_name }}"

      # Everyday commands, the MCP server, and two offline pipeline runs
      # against a local site and a fake LLM. A broken binary is never uploaded.
      - name: Smoke test the binary
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          uv run python scripts/smoke_test.py "dist/${{ matrix.asset_name }}" --version "$VERSION" --mcp --e2e

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

  create-release:
    needs: [tests, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
