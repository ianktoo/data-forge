name: Build Cross-Platform Executables

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: dataforge
            asset_name: dataforge-linux-x64
          - os: windows-latest
            artifact_name: dataforge.exe
            asset_name: dataforge-windows-x64.exe
          # macos-latest runners are Apple Silicon, so this build is arm64.
          - os: macos-latest
            artifact_name: dataforge
            asset_name: dataforge-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Build executable
        run: uv run pyinstaller --onefile --name dataforge --exclude-module kaggle src/dataforge/main.py
        env:
          PYTHONPATH: src

      # The release uploads files by their own name, not the artifact's, and
      # the Linux and macOS builds are both `dataforge`: without this copy one
      # overwrote the other and the release had no macOS binary (#51).
      - name: Name the binary for its platform
        shell: bash
        run: cp "dist/${{ matrix.artifact_name }}" "dist/${{ matrix.asset_name }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

  create-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
