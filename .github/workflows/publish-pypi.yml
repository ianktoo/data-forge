name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # The full CI suite (every OS, plus the installed-package smoke
  # test) must pass before anything reaches PyPI.
  tests:
    uses: ./.github/workflows/test.yml

  build-and-publish:
    needs: tests
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publisher (OIDC) auth

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -m 'not integration' -q

      - name: Audit dependencies
        run: uv run pip-audit --require-hashes -r <(uv export --no-emit-project --format requirements-txt) || true

      - name: Build distributions
        run: uv build --no-sources

      - name: Publish to PyPI
        run: uv publish
