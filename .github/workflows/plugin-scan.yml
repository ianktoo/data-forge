name: Plugin Security Scan

# HOL plugin scanner, the preflight used by the awesome-ai-plugins catalog.
# Listing does not require this workflow, but maintaining it earns the full
# registry trust score instead of a 10% reduction. It needs no secrets and
# only reads the repository.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: scan
        uses: hashgraph-online/ai-plugin-scanner-action@caba2e96aa8ad2feb6cf6fca52442b52e22e779f # v1.2.635
        with:
          plugin_dir: "."
          min_score: 80
          fail_on_severity: high
          format: json
          output: scan-report.json
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plugin-scan-report
          path: scan-report.json
          if-no-files-found: warn
